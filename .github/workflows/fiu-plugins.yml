name: fiu plugins

on:
  pull_request:
    paths:
      - "fiu-plugins/**"
      - ".github/workflows/fiu-plugins.yml"
  push:
    branches: [main]
    paths:
      - "fiu-plugins/**"
      - ".github/workflows/fiu-plugins.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Typecheck and test every plugin
        run: |
          status=0
          for plugin in fiu-plugins/*/; do
            echo "::group::$plugin"
            if (cd "$plugin" && bun install --frozen-lockfile && bun run verify); then
              echo "PASS $plugin"
            else
              echo "::error::$plugin failed verify"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
