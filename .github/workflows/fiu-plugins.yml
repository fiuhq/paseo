name: fiu plugins

on:
  pull_request:
    paths:
      - "fiu-plugins/**"
      - ".github/workflows/fiu-plugins.yml"
  push:
    branches: [main]
    paths:
      - "fiu-plugins/**"
      - ".github/workflows/fiu-plugins.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Typecheck and test every plugin
        run: |
          status=0
          for plugin in fiu-plugins/*/; do
            echo "::group::$plugin"
            if (cd "$plugin" && bun install --frozen-lockfile && bun run verify); then
              echo "PASS $plugin"
            else
              echo "::error::$plugin failed verify"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
